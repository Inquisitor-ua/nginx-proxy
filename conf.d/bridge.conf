# Cloudflare's "Always Use HTTPS" handles the visitor-facing redirect, so
# origin :80 is just a safety net for anything that reaches it directly.
server {
    listen 80;
    server_name bridge.yehor-inq.com;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate the Cloudflare -> origin TLS hop (Full / Full strict)
# using a Cloudflare Origin CA certificate (see README.md), then forward to
# the bridge card game (FastAPI/uvicorn serving both the built Vue frontend
# and the /ws WebSocket), reachable by name on the shared "edge" network.
server {
    listen 443 ssl;
    http2 on;
    server_name bridge.yehor-inq.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The whole game runs over this one long-lived WebSocket; without the
    # Upgrade headers nginx would speak plain HTTP/1.0 to uvicorn, and the
    # default 60s read timeout would drop quiet games.
    location /ws {
        proxy_pass http://bridge-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://bridge-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
