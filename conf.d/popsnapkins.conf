# Cloudflare's "Always Use HTTPS" handles the visitor-facing redirect, so
# origin :80 is just a safety net for anything that reaches it directly.
server {
    listen 80;
    server_name popsnapkins.yehor-inq.com;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate the Cloudflare -> origin TLS hop (Full / Full strict)
# using a Cloudflare Origin CA certificate (see README.md), then hand off
# to the popsnapkins shop (Django via gunicorn running on the host). Static
# files (output of collectstatic) and uploaded product images are served
# here directly from the mounted ../popsnapkins/staticfiles and
# ../popsnapkins/media volumes (see docker-compose.yml).
server {
    listen 443 ssl;
    http2 on;
    server_name popsnapkins.yehor-inq.com;

    # Product image uploads through the Django admin.
    client_max_body_size 25M;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WhiteNoise's CompressedManifestStaticFilesStorage writes hashed
    # filenames plus pre-compressed .gz copies during collectstatic, so
    # nginx can send those as-is and let browsers cache them for long.
    location /static/ {
        alias /etc/nginx/static/popsnapkins/;
        gzip_static on;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /etc/nginx/media/popsnapkins/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://host.docker.internal:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
