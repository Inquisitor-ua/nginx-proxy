# Cloudflare's "Always Use HTTPS" handles the visitor-facing redirect, so
# origin :80 is just a safety net for anything that reaches it directly.
server {
    listen 80;
    server_name yehor-inq.com www.yehor-inq.com;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate the Cloudflare -> origin TLS hop (Full / Full strict)
# using a Cloudflare Origin CA certificate (see README.md), then hand off
# to the portfolio app (Django/Wagtail via gunicorn), reachable by name on
# the shared "edge" network. Static assets are served by WhiteNoise from
# inside gunicorn; Wagtail-uploaded media files are served here directly
# from the mounted ../portfolio/media volume (see docker-compose.yml).
server {
    listen 443 ssl;
    http2 on;
    server_name yehor-inq.com www.yehor-inq.com;

    client_max_body_size 25M;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /media/ {
        alias /etc/nginx/media/portfolio/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://portfolio-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
