# Cloudflare's "Always Use HTTPS" handles the visitor-facing redirect, so
# origin :80 is just a safety net for anything that reaches it directly.
server {
    listen 80;
    server_name splitbot.yehor-inq.com;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate the Cloudflare -> origin TLS hop (Full / Full strict)
# using a Cloudflare Origin CA certificate (see README.md), then forward to
# splitbot's FastAPI/uvicorn web-auth app (the "Connect Telegram account"
# login page), reachable by name on the shared "edge" network. This is the
# only part of splitbot exposed publicly — the bot itself only talks
# outbound to Telegram's API, no inbound port needed for it.
server {
    listen 443 ssl;
    http2 on;
    server_name splitbot.yehor-inq.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://splitbot-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
