# Cloudflare's "Always Use HTTPS" handles the visitor-facing redirect, so
# origin :80 is just a safety net for anything that reaches it directly.
server {
    listen 80;
    server_name crossword.yehor-inq.com;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate the Cloudflare -> origin TLS hop (Full / Full strict)
# using a Cloudflare Origin CA certificate (see README.md), then hand off
# to crossword's own nginx container (which already handles /static/
# caching), reachable by name on the shared "edge" network.
server {
    listen 443 ssl;
    http2 on;
    server_name crossword.yehor-inq.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://crossword-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
